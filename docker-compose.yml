services:
  cc-connect:
    build:
      context: .
    container_name: cc-connect
    restart: unless-stopped
    command: ["--config", "/data/config.toml"]
    working_dir: /data
    volumes:
      - ./docker-data:/data
      - ${HOME}/workspace:/workspace
    environment:
      TZ: ${TZ:-UTC}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}

    # Uncomment when using LINE / WeCom or other webhook-based platforms.
    # ports:
    #   - "8080:8080"
    #   - "8081:8081"
