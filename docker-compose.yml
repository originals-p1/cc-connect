services:
  cc-connect:
    build:
      context: .
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        all_proxy: ${all_proxy:-}
        NO_PROXY: ${NO_PROXY:-}
        no_proxy: ${no_proxy:-}
    container_name: cc-connect
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    command: ["--config", "/data/config.toml"]
    working_dir: /data
    volumes:
      - ./docker-data:/data
      - /home/tz/workspace:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOME: /data/.home
      TZ: ${TZ:-UTC}
      HTTP_PROXY: ${DOCKER_HTTP_PROXY:-}
      HTTPS_PROXY: ${DOCKER_HTTPS_PROXY:-}
      ALL_PROXY: ${DOCKER_ALL_PROXY:-}

    # Uncomment when using LINE / WeCom or other webhook-based platforms.
    # ports:
    #   - "8080:8080"
    #   - "8081:8081"
